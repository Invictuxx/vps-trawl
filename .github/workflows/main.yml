```yaml
name: Run TRAWL for 6 hours

on:
  workflow_dispatch:

jobs:
  trawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start TRAWL
        run: |
          docker compose up -d

      - name: Wait for TRAWL
        run: |
          echo "Waiting for TRAWL..."

          for i in {1..60}; do
            if curl -fsS http://localhost:8191/health; then
              echo
              echo "TRAWL is ready."
              exit 0
            fi

            sleep 5
          done

          echo "TRAWL failed to start."
          docker compose logs
          exit 1

      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          docker run -d \
            --name cloudflared \
            --restart unless-stopped \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN"

      - name: Check Cloudflare Tunnel
        run: |
          sleep 10
          docker logs cloudflared --tail 50

      - name: Keep services running for 6 hours
        run: |
          echo "TRAWL is running."
          echo "Cloudflare Tunnel is running."
          echo "Keeping services alive for 6 hours..."
          sleep 21600

      - name: Show logs
        if: always()
        run: |
          echo "===== TRAWL ====="
          docker compose logs --tail=500

          echo "===== CLOUDFLARED ====="
          docker logs cloudflared --tail 500
```
