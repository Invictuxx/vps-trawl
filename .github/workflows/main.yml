name: Run TRAWL for 6 hours

on:
  workflow_dispatch:

jobs:
  trawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Clone TRAWL
        run: |
          git clone https://github.com/germondai/trawl
          cd trawl

      - name: Configure TRAWL
        working-directory: trawl
        run: |
          cp .env.example .env

          echo "TRAWL configuration:"
          ls -la
          echo
          echo ".env created successfully"

      - name: Start scraper + Redis
        working-directory: trawl
        run: |
          docker compose up -d

      - name: Verify TRAWL
        working-directory: trawl
        run: |
          echo "Waiting for TRAWL..."

          for i in {1..60}; do
            if curl -fsS http://localhost:8191/health; then
              echo
              echo "TRAWL is healthy!"
              exit 0
            fi

            echo "Attempt $i/60..."
            sleep 5
          done

          echo "TRAWL failed to become healthy."
          docker compose logs
          exit 1

      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_TUNNEL_TOKEN is not configured."
            exit 1
          fi

          docker run -d \
            --name cloudflared \
            --network host \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN"

      - name: Verify Cloudflare Tunnel
        run: |
          sleep 10

          echo "Cloudflare Tunnel:"
          docker ps --filter name=cloudflared

          echo
          echo "Cloudflare Tunnel logs:"
          docker logs cloudflared --tail 100

      - name: Keep TRAWL running for 6 hours
        run: |
          echo "========================================"
          echo "TRAWL is running"
          echo "http://localhost:8191"
          echo "========================================"
          echo "Cloudflare Tunnel is running"
          echo "========================================"
          echo "Keeping everything alive for 6 hours..."
          echo "========================================"

          sleep 21600

      - name: Show logs
        if: always()
        working-directory: trawl
        run: |
          echo "===== TRAWL / REDIS ====="
          docker compose logs --tail=500 || true

          echo
          echo "===== CLOUDFLARED ====="
          docker logs cloudflared --tail 500 || true
